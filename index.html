<!DOCTYPE html>
<html lang="sk" class="h-full bg-slate-50 text-slate-900">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anatomický Atlas Mozgu</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{font-family:'Inter',sans-serif}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:#f1f5f9}
::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:3px}
.brain-region{cursor:pointer;transition:all .2s ease-in-out;stroke:#475569;stroke-width:1.5;stroke-dasharray:4}
.brain-region:hover{filter:drop-shadow(0 4px 6px rgba(0,0,0,.15));stroke-dasharray:0;stroke-width:2.5;stroke:#2563eb;opacity:.95}
</style>
</head>
<body class="min-h-screen bg-slate-50 text-slate-800 flex flex-col justify-between selection:bg-blue-500 selection:text-white">

<header class="w-full max-w-5xl mx-auto px-4 sm:px-6 py-4 flex items-center justify-between border-b border-slate-200 bg-white shadow-sm sticky top-0 z-50">
  <div class="flex items-center gap-3 cursor-pointer" onclick="switchSlide('overview')">
    <div class="w-9 h-9 rounded-xl bg-slate-900 flex items-center justify-center text-white shadow-md"><i class="fa-solid fa-brain text-base"></i></div>
    <div>
      <h1 class="text-sm sm:text-base font-bold tracking-tight text-slate-900 leading-none">Anatomický Atlas Mozgu</h1>
      <p class="text-[10px] sm:text-xs text-slate-500 mt-0.5">Interaktívna prezentácia k 3D modelu</p>
    </div>
  </div>
  <div class="hidden sm:flex items-center gap-2 bg-slate-100 px-3 py-1.5 rounded-full text-xs font-semibold text-slate-600">
    <i class="fa-solid fa-layer-group text-slate-400"></i><span id="header-slide-num">1 / 11</span>
  </div>
</header>

<main id="presentation-container" class="flex-1 w-full max-w-5xl mx-auto px-4 sm:px-6 py-6 sm:py-8 flex items-center justify-center">
  <!-- Slidy sa generujú zo zoznamu S nižšie -->
  <div id="slide-overview" class="slide-content w-full space-y-6 sm:space-y-8">
    <div class="text-center max-w-2xl mx-auto space-y-2">
      <h2 class="text-2xl sm:text-3xl font-extrabold text-slate-900 tracking-tight">Ľudský Mozog & Jeho Štruktúry</h2>
      <p class="text-xs sm:text-sm text-slate-600 leading-relaxed">Kliknite na požadovanú časť na schéme, zvoľte si kartičku nižšie alebo použite navigáciu prechádzania prezentácie.</p>
    </div>
    <div class="p-3 sm:p-6 rounded-2xl bg-white border border-slate-200 shadow-sm relative overflow-hidden flex flex-col items-center">
      <div class="w-full max-w-xl aspect-[4/3] relative">
        <svg id="brain-svg" viewBox="0 0 600 450" class="w-full h-auto drop-shadow-md max-h-[50vh] sm:max-h-none" xmlns="http://www.w3.org/2000/svg" style="transform: scaleX(-1);"></svg>
      </div>
    </div>
    <div id="cards" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3 sm:gap-4 pt-2"></div>
  </div>
</main>

<div class="sticky bottom-0 w-full bg-white/95 backdrop-blur-md border-t border-slate-200 py-3 px-4 shadow-lg z-50">
  <div class="max-w-5xl mx-auto flex items-center justify-between gap-2">
    <button onclick="prevSlide()" class="px-3.5 sm:px-5 py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-800 text-xs sm:text-sm font-semibold transition-all flex items-center gap-2 shadow-sm active:scale-95">
      <i class="fa-solid fa-chevron-left text-xs"></i><span class="hidden sm:inline">Predchádzajúci</span>
    </button>
    <div class="flex items-center gap-2">
      <span id="current-slide-title" class="text-xs font-bold text-slate-800 truncate max-w-[140px] sm:max-w-xs text-center">Úvodná schéma</span>
      <span id="slide-indicator-footer" class="text-xs font-semibold text-slate-500 bg-slate-100 px-2.5 py-1 rounded-lg">1/11</span>
    </div>
    <button onclick="nextSlide()" class="px-3.5 sm:px-5 py-2.5 rounded-xl bg-blue-600 hover:bg-blue-700 text-white text-xs sm:text-sm font-semibold transition-all flex items-center gap-2 shadow-sm active:scale-95">
      <span class="hidden sm:inline">Nasledujúci</span><i class="fa-solid fa-chevron-right text-xs"></i>
    </button>
  </div>
</div>

<script>
// ---------- DÁTA ----------
// id, anchor, c (farba Tailwind), g (gradient), title, short, latin, blurb (karta v prehľade), sum (charakteristika),
// cards [[ikona, nadpis, text]], more [nadpis, text], path (SVG), label [text, x, y, veľkosť, farba]
const S = [
{id:'frontalny-lalok',a:'celny',c:'blue',g:['#3b82f6','#2563eb'],
 title:'Čelný lalok predného mozgu',short:'Čelný lalok predného mozgu',latin:'Lobus frontalis',
 blurb:'Plánovanie, reč (Brocova oblasť), rozhodovanie, motorická kôra.',
 sum:'Najväčší lalok mozgovej kôry predného mozgu (prosencephalon), umiestnený v prednej časti lebky. Zodpovedá za vyššiu kognitívnu činnosť, plánovanie, osobnostné črty a riadenie úmyselnej motoriky.',
 cards:[['fa-sliders','Prefrontálna kôra','Exekutívne funkcie, abstraktné myslenie, rozhodovanie, vyjadrovanie osobnosti a potláčanie nevhodných impulzov.'],
 ['fa-comment-dots','Brocovo rečové centrum','Motorické centrum reči v dominantnej hemisfére. Riadi svalovú artikuláciu hlasiviek, jazyka a úst pre tvorbu slov.'],
 ['fa-child-reaching','Primárna motorická kôra (Gyrus praecentralis)','Vytvára nervové impulzy pre úmyselný pohyb kostrového svalstva vysielané cez pyramídové dráhy. Od Rolandovej ryhy ju oddeľuje temenný lalok.']],
 more:['Klinický význam','Poškodenie čelného laloku sa prejavuje zmenami osobnosti, impulzivitou, stratou iniciatívy a problémami s plánovaním. Poškodenie Brocovej oblasti vyvoláva Brocovu afáziu – človek rozumie reči, no ťažko ju tvorí. Čelný lalok dozrieva ako posledný, približne do 25. roku života.'],
 path:'M 160,220 C 120,190 120,130 180,80 C 230,40 310,40 340,70 C 320,120 280,180 230,220 C 200,240 170,230 160,220 Z',label:['Čelný lalok|predného mozgu',380,104,11]},
{id:'parietalny-lalok',a:'temenny',c:'purple',g:['#8b5cf6','#7c3aed'],
 title:'Temenný lalok predného mozgu',short:'Temenný lalok predného mozgu',latin:'Lobus parietalis',
 blurb:'Spracovanie hmatu, teplota, bolesť a priestorová orientácia.',
 sum:'Situovaný v hornej strednej časti kôry predného mozgu. Integratívne centrum pre somatické zmyslové vnímanie a priestorovú orientáciu.',
 cards:[['fa-hand','Somatosenzorická kôra (Gyrus postcentralis)','Prijíma a spracúva hmatové podnety, tlak, vibrácie, zmeny teploty a pocity bolesti z povrchu aj hĺbky celého tela.'],
 ['fa-compass','Propriocepcia & Priestorová mapa','Spracováva informácie o polohe kĺbov a svalov, spája zrakové podnety s pohybom a vytvára vnútorný obraz tela v priestore.'],
 ['fa-calculator','Asociačné oblasti','Podieľajú sa na čítaní, počítaní, pozornosti a na integrácii informácií z rôznych zmyslov do jedného celku.']],
 more:['Klinický význam','Poškodenie temenného laloku môže spôsobiť hemispatiálny neglekt (ignorovanie jednej polovice priestoru), apraxiu, poruchy čítania a počítania či neschopnosť rozpoznať predmety hmatom. Reprezentácia tela v kôre sa nazýva homunkulus – citlivejšie časti, napríklad prsty a pery, zaberajú väčšiu plochu.'],
 path:'M 340,70 C 390,70 440,100 460,140 C 430,190 370,210 320,200 C 310,160 320,110 340,70 Z',label:['Temenný lalok|predného mozgu',215,124,11]},
{id:'temporalny-lalok',a:'spankovy',c:'indigo',g:['#6366f1','#4f46e5'],
 title:'Spánkový lalok',short:'Spánkový lalok',latin:'Lobus temporalis',
 blurb:'Sluch, porozumenie reči (Wernickeova oblasť) a pamäť.',
 sum:'Umiestnený na bočných stranách pod postrannou brázdou (Sylviova ryha). Obsahuje primárne sluchové oblasti, centrum pre porozumenie reči a pamäťové štruktúry.',
 cards:[['fa-ear-listen','Sluchová kôra & Wernickeovo centrum','Spracovanie akustických vnemov a porozumenie hovorenej aj písanej reči.'],
 ['fa-brain','Hippokampus','Kľúčový pre konsolidáciu pamäti – prevod informácií z krátkodobej do dlhodobej pamäti a priestorovú navigáciu.'],
 ['fa-face-smile','Rozpoznávanie tvárí','Dolná časť laloku sa podieľa na rozpoznávaní tvárí a objektov a na sémantickej pamäti – chápaní významu slov a pojmov.']],
 more:['Klinický význam','Poškodenie Wernickeovej oblasti spôsobuje plynulú, ale nezrozumiteľnú reč a zlé porozumenie (Wernickeova afázia). Spánkový lalok je tiež najčastejším miestom vzniku epileptických záchvatov a postihuje ho aj Alzheimerova choroba, a to najskôr v oblasti hippokampu.'],
 path:'M 230,220 C 280,180 340,190 380,220 C 370,260 300,280 240,270 C 220,250 220,230 230,220 Z',label:['Spánkový lalok',310,250,11]},
{id:'okcipitalny-lalok',a:'zahlavny',c:'cyan',g:['#06b6d4','#0891b2'],
 title:'Záhlavný lalok',short:'Záhlavný lalok',latin:'Lobus occipitalis',
 blurb:'Primárne zrakové centrum a spracovanie vizuálneho obrazu.',
 sum:'Najzadnejšia časť mozgovej kôry, plne špecializovaná na prijímanie a analýzu zrakových signálov zo sietnice oka.',
 cards:[['fa-eye','Primárna zraková kôra (V1)','Prijíma informácie zo zrakového nervu a dešifruje základné vlastnosti obrazu, ako sú línie, hrany, kontrast a farby.'],
 ['fa-icons','Vizuálna asociácia','Rozpoznávanie komplexných tvarov, objektov, tvárí, čítanie písmen a sledovanie pohybu predmetov v priestore.'],
 ['fa-route','Zrakové dráhy','Informácia z oboch očí prichádza cez zrakovú dráhu a talamus. Ľavá polovica zorného poľa sa spracúva v pravom laloku a naopak.']],
 more:['Klinický význam','Poškodenie záhlavného laloku môže spôsobiť výpadky zorného poľa (hemianopsiu) alebo kortikálnu slepotu, pri ktorej sú oči zdravé, ale mozog obraz nespracuje. Časť zrakového spracovania prebieha v dvoch prúdoch – „čo to je“ (do spánkového laloku) a „kde to je“ (do temenného laloku).'],
 path:'M 460,140 C 490,170 500,220 470,260 C 420,270 390,240 380,220 C 410,180 440,160 460,140 Z',label:['Záhlavný',160,210,11]},
{id:'limbicky-system',a:'limbicky',c:'pink',g:['#ec4899','#db2777'],
 title:'Limbický systém & Medzimozog',short:'Limbický systém',latin:'Systema limbicum & Diencephalon',
 blurb:'Emócie (amygdala), dlhodobá pamäť (hippokampus), talamus a hypotalamus.',
 sum:'Hlboké subkortikálne štruktúry zodpovedné za emočné reakcie, inštinkty, hormonálnu reguláciu a filtráciu zmyslových informácií.',
 cards:[['fa-heart-pulse','Amygdala & Hippokampus','Spracovanie strachu, hnevu, pocitov odmeny a ich prepojenie s dlhodobou pamäťou.'],
 ['fa-temperature-half','Talamus & Hypotalamus','Talamus funguje ako hlavná zmyslová prepájacia stanica. Hypotalamus riadi autonómny systém, vnútornú teplotu, smäd, hlad a hormóny (cez podmozgovú žľazu – hypofýzu).'],
 ['fa-seedling','Epifýza & Gyrus cinguli','Epifýza vylučuje melatonín a riadi denný rytmus. Gyrus cinguli prepája emócie s pozornosťou a motiváciou.']],
 more:['Zaujímavosť','Amygdala vyhodnotí hrozbu skôr, než si ju stihneme uvedomiť – preto reagujeme strachom takmer okamžite. Hypotalamus je veľký len ako mandľa, no udržiava rovnováhu celého organizmu (homeostázu). Všetky zmysly okrem čuchu prechádzajú cez talamus.'],
 path:'M 250,170 C 300,160 340,170 350,200 C 330,230 270,230 250,200 Z',label:['Limbický systém',300,195,10]},
{id:'svorkovite-teleso',a:'svorkovite',c:'rose',g:['#f43f5e','#e11d48'],
 title:'Svorkovité teleso',short:'Svorkovité teleso',latin:'Corpus callosum',
 blurb:'Mohutný zväzok nervových vlákien spájajúci ľavú a pravú hemisféru.',
 sum:'Masívny zväzok viac ako 200 miliónov myelinizovaných nervových vlákien (komisurálne dráhy), ktorý prepája pravú a ľavú mozgovú hemisféru.',
 cards:[['fa-network-wired','Medzihemisférová komunikácia','Umožňuje okamžité zdieľanie a koordináciu informácií medzi ľavou a pravou hemisférou.'],
 ['fa-diagram-project','Integrácia motoriky a zmyslov','Zabezpečuje synchronizovanú prácu oboch rúk a obojstranné spracovanie zrakového aj sluchového poľa.'],
 ['fa-ruler','Stavba','Delí sa na rostrum, genu, truncus a splenium – od prednej po zadnú časť. Je najväčšou bielou hmotou v mozgu.']],
 more:['Klinický význam','Pri ťažkej epilepsii sa niekedy svorkovité teleso chirurgicky pretína (kalózotómia). Takíto pacienti sa označujú ako „split-brain“ – každá hemisféra spracúva informácie samostatne, čo umožnilo preskúmať špecializáciu hemisfér. Mnohé funkcie však zostávajú zachované.'],
 path:'M 230,150 C 260,120 330,120 360,150 C 340,165 280,165 230,150 Z',label:['Svorkovité teleso',310,142,9]},
{id:'mozocek',a:'mozocek',c:'emerald',g:['#10b981','#059669'],
 title:'Mozoček',short:'Mozoček',latin:'Cerebellum',
 blurb:'Koordinácia pohybov, rovnováha, svalový tonus a motorická pamäť.',
 sum:'Nachádza sa v zadnej jame lebkovej pod záhlavným lalokom. Obsahuje viac ako polovicu všetkých neurónov ľudského mozgu.',
 cards:[['fa-person-running','Koordinácia & Rovnováha','Precízne dolaďuje svalové pohyby, udáva presné časovanie svalových sťahov a udržiava vzpriamený postoj tela.'],
 ['fa-person-biking','Motorické učenie','Ukladanie automatizovaných pohybových návykov (písanie, hra na nástroj, športové úkony) bez nutnosti vedomého premýšľania.'],
 ['fa-diagram-successor','Stavba a spojenia','S kmeňom je spojený tromi párami stopiek (pedunculi). Skladá sa z dvoch hemisfér a stredného červa (vermis).']],
 more:['Klinický význam','Poškodenie mozočka vyvoláva ataxiu – neistú chôdzu, trasenie pri cielených pohyboch a poruchy reči. Pri ťažkom poškodení si človek neudrží rovnováhu, hoci svalovú silu nestratí. Moderný výskum ukazuje, že sa mozoček podieľa aj na pozornosti a jazyku.'],
 path:'M 380,270 C 440,270 470,300 450,350 C 390,370 360,330 360,300 C 360,280 370,270 380,270 Z',label:['Mozoček',190,320,11]},
{id:'stredny-mozog',a:'stredny',c:'amber',g:['#f59e0b','#d97706'],
 title:'Stredný mozog',short:'Stredný mozog',latin:'Mesencephalon',
 blurb:'Najvyššia časť mozgového kmeňa: zrakové a sluchové reflexy, pohyb očí, dopamín.',
 sum:'Najkratšia a najvyššia časť mozgového kmeňa, ktorá spája medzimozog s Varolovým mostom. Prechádza ním Sylviov akvadukt a vedú sa ním dôležité motorické aj senzorické dráhy.',
 cards:[['fa-eye-low-vision','Tectum (strecha)','Colliculi superiores riadia zrakové reflexy a rýchle pohyby očí, colliculi inferiores sluchové reflexy (otočenie hlavy za zvukom).'],
 ['fa-bolt','Substantia nigra & Nucleus ruber','Čierna substancia produkuje dopamín a riadi plynulosť pohybu. Červené jadro sa podieľa na koordinácii pohybov a svalovom tonuse.'],
 ['fa-eye','Hlavové nervy III a IV','Nervus oculomotorius a trochlearis vychádzajú zo stredného mozgu a ovládajú väčšinu očných svalov a veľkosť zrenice.']],
 more:['Klinický význam','Úbytok dopamínových neurónov v čiernej substancii spôsobuje Parkinsonovu chorobu – trasenie, stuhnutosť a spomalené pohyby. Poškodenie oblasti môže vyvolať poruchy pohybu očí alebo rozšírenú zrenicu.'],
 path:'M 298,280 C 330,280 345,292 346,308 L 286,308 C 287,295 291,287 298,280 Z',label:['Stredný mozog',385,297,10,'#334155'],ly:297},
{id:'varolov-most',a:'varolov',c:'orange',g:['#fb923c','#ea580c'],
 title:'Varolov most',short:'Varolov most',latin:'Pons',
 blurb:'Prepojenie mozgu a mozočka, dýchanie, spánok a hlavové nervy V–VIII.',
 sum:'Stredná časť mozgového kmeňa, ktorá leží pred mozočkom. Pomenoval ho taliansky anatóm Costanzo Varolio. Slúži ako „most“ medzi kôrou, mozočkom a miechou.',
 cards:[['fa-link','Prepojenie s mozočkom','Priečne vlákna mosta prenášajú informácie z kôry do mozočka cez stredné mozočkové stopky, čo je základ koordinovaného pohybu.'],
 ['fa-lungs','Regulácia dýchania & spánku','Pneumotaxické a apneustické centrum dolaďujú rytmus dýchania. Jadrá mosta sa podieľajú aj na riadení REM spánku.'],
 ['fa-face-grin-tongue','Hlavové nervy V až VIII','Trojklanný, odťahujúci, tvárový a sluchovo-rovnovážny nerv zabezpečujú žuvanie, pohyb očí do strán, mimiku, chuť a sluch.']],
 more:['Klinický význam','Poškodenie mosta môže spôsobiť syndróm uzamknutia (locked-in) – človek je pri plnom vedomí, no hýbe sa len očami. Ide o dôsledok prerušenia dráh, ktoré tadiaľ vedú z kôry do svalov.'],
 path:'M 286,308 L 346,308 C 349,322 348,334 346,344 L 281,344 C 281,330 283,318 286,308 Z',label:['Varolov most',385,328,10,'#334155'],ly:328},
{id:'predlzena-miecha',a:'predlzena',c:'red',g:['#f87171','#dc2626'],
 title:'Predĺžená miecha',short:'Predĺžená miecha',latin:'Medulla oblongata',
 blurb:'Dýchanie, srdcová frekvencia, krvný tlak a ochranné reflexy.',
 sum:'Najspodnejšia časť mozgového kmeňa, ktorá plynule prechádza do miechy v úrovni veľkého záhlavného otvoru (foramen magnum). Je to najdôležitejšia časť mozgu pre prežitie.',
 cards:[['fa-heart-pulse','Životne dôležité centrá','Automaticky riadi dýchanie, srdcovú frekvenciu a krvný tlak.'],
 ['fa-head-side-cough','Ochranné reflexy','Sídlo reflexov vracania, kašľa, kýchania, prehĺtania a štikútania.'],
 ['fa-shuffle','Skríženie pyramídových dráh','Väčšina motorických vlákien sa tu kríži (decussatio pyramidum), preto ľavá hemisféra ovláda pravú stranu tela a naopak.']],
 more:['Klinický význam','Poškodenie predĺženej miechy je často smrteľné, pretože zlyhá dýchanie a krvný obeh. Tlak na túto oblasť pri zvýšenom vnútrolebečnom tlaku, napríklad pri vkliňovaní mozočkových mandlí, môže viesť k zástave dýchania.'],
 path:'M 281,344 L 346,344 C 345,365 343,382 340,392 C 310,402 290,392 281,360 C 280,355 281,350 281,344 Z',label:['Predĺžená miecha',385,372,10,'#334155'],ly:372}
];
const TOTAL = S.length + 1;
const seq = ['overview', ...S.map(s => s.id)];
const anchorOf = Object.fromEntries([['overview','uvod'], ...S.map(s => [s.id, s.a])]);
const slideOfAnchor = Object.fromEntries(Object.entries(anchorOf).map(([k, v]) => [v, k]));
slideOfAnchor['kmen'] = 'stredny-mozog';   // stará kotva
slideOfAnchor['zatylny'] = 'okcipitalny-lalok'; // stará kotva
const titleOf = Object.fromEntries([['overview','Úvodná schéma'], ...S.map(s => [s.id, s.short])]);

// ---------- GENEROVANIE ----------
const svg = document.getElementById('brain-svg');
let defs = '', paths = '', labels = '', lines = '';
S.forEach(s => {
  defs += `<linearGradient id="grad-${s.id}" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="${s.g[0]}" stop-opacity="0.85"/><stop offset="100%" stop-color="${s.g[1]}" stop-opacity="0.75"/></linearGradient>`;
  paths += `<path class="brain-region" fill="url(#grad-${s.id})" onclick="switchSlide('${s.id}')" d="${s.path}"><title>${s.title}</title></path>`;
  const l = s.label;
  l[0].split('|').forEach((row, k) => { labels += `<text x="${l[1]}" y="${l[2] + k * (l[3] + 3)}" font-size="${l[3]}" fill="${l[4] || '#ffffff'}">${row}</text>`; });
  if (s.ly) lines += `<line x1="262" y1="${s.ly - 4}" x2="${s.id === 'stredny-mozog' ? 300 : s.id === 'varolov-most' ? 285 : 283}" y2="${s.ly - 4}" stroke="#94a3b8" stroke-width="1" pointer-events="none"/>`;
});
svg.innerHTML = `<defs>${defs}</defs><g>${paths}${lines}</g><g transform="translate(600 0) scale(-1 1)" font-family="Inter, sans-serif" font-weight="700" text-anchor="middle" pointer-events="none">${labels}</g>`;

const main = document.getElementById('presentation-container');
let cardsHtml = '', slidesHtml = '';
S.forEach((s, i) => {
  const c = s.c, n = String(i + 1).padStart(2, '0');
  cardsHtml += `<div onclick="switchSlide('${s.id}')" class="p-4 rounded-xl bg-white border border-slate-200 hover:border-${c}-500 cursor-pointer transition-all hover:shadow-md space-y-2 group">
    <div class="w-8 h-8 rounded-lg bg-${c}-50 text-${c}-600 flex items-center justify-center font-bold text-xs group-hover:bg-${c}-600 group-hover:text-white transition-colors">${n}</div>
    <h3 class="text-sm font-bold text-slate-900 group-hover:text-${c}-600 transition-colors">${s.title}<span class="text-[11px] font-normal text-slate-500 block italic">${s.latin}</span></h3>
    <p class="text-xs text-slate-600">${s.blurb}</p></div>`;
  const cards = s.cards.map((k, j) => `<div class="p-4 sm:p-5 rounded-xl bg-white border border-slate-200 space-y-2 shadow-sm ${j === 2 ? 'md:col-span-2' : ''}">
    <h3 class="text-xs sm:text-sm font-bold text-${c}-600 flex items-center gap-2"><i class="fa-solid ${k[0]}"></i> ${k[1]}</h3>
    <p class="text-xs text-slate-600 leading-relaxed">${k[2]}</p></div>`).join('');
  slidesHtml += `<div id="slide-${s.id}" class="slide-content w-full space-y-5 sm:space-y-6 hidden">
    <div class="flex flex-wrap items-center justify-between border-b border-slate-200 pb-4 gap-3">
      <div><span class="text-xs font-bold text-${c}-600 uppercase tracking-wider">${s.latin}</span>
      <h2 class="text-xl sm:text-2xl font-extrabold text-slate-900 mt-0.5">${s.title}</h2></div>
      <button onclick="switchSlide('overview')" class="px-3.5 py-2 rounded-xl bg-slate-100 border border-slate-200 text-xs font-semibold text-slate-700 hover:bg-slate-200 transition-colors flex items-center gap-2"><i class="fa-solid fa-grip"></i> Prehľad</button>
    </div>
    <div class="p-4 sm:p-5 rounded-xl bg-${c}-50 border border-${c}-100 text-xs sm:text-sm text-${c}-950 leading-relaxed"><strong>Anatomická charakteristika:</strong> ${s.sum}</div>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-3 sm:gap-4">${cards}</div>
    <div class="p-4 sm:p-5 rounded-xl bg-slate-900 text-slate-100 space-y-1.5">
      <h3 class="text-xs sm:text-sm font-bold flex items-center gap-2"><i class="fa-solid fa-circle-info text-${c}-400"></i> ${s.more[0]}</h3>
      <p class="text-xs text-slate-300 leading-relaxed">${s.more[1]}</p></div>
  </div>`;
});
document.getElementById('cards').innerHTML = cardsHtml;
main.insertAdjacentHTML('beforeend', slidesHtml);

// ---------- NAVIGÁCIA ----------
let cur = 0;
window.switchSlide = function (id) {
  let idx = seq.indexOf(id);
  if (idx === -1 || !document.getElementById('slide-' + id)) { idx = 0; id = 'overview'; }
  cur = idx;
  document.querySelectorAll('.slide-content').forEach(el => el.classList.add('hidden'));
  document.getElementById('slide-' + id).classList.remove('hidden');
  document.getElementById('slide-indicator-footer').textContent = `${cur + 1}/${TOTAL}`;
  document.getElementById('header-slide-num').textContent = `${cur + 1} / ${TOTAL}`;
  document.getElementById('current-slide-title').textContent = titleOf[id] || 'Prezentácia';
  try {
    const h = '#' + anchorOf[id];
    if (location.hash !== h) history.replaceState(null, '', h);
  } catch (e) {}
  window.scrollTo({ top: 0, behavior: 'smooth' });
};
window.nextSlide = () => switchSlide(seq[(cur + 1) % seq.length]);
window.prevSlide = () => switchSlide(seq[(cur - 1 + seq.length) % seq.length]);

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') nextSlide();
  else if (e.key === 'ArrowLeft') prevSlide();
});
let tx0 = 0;
document.body.addEventListener('touchstart', e => { tx0 = e.changedTouches[0].screenX; }, { passive: true });
document.body.addEventListener('touchend', e => {
  const d = e.changedTouches[0].screenX - tx0;
  if (d < -50) nextSlide(); else if (d > 50) prevSlide();
}, { passive: true });

function openFromHash() {
  const h = decodeURIComponent(location.hash.slice(1));
  const id = slideOfAnchor[h] || h;
  switchSlide(seq.includes(id) ? id : 'overview');
}
openFromHash();
window.addEventListener('hashchange', openFromHash);
window.addEventListener('popstate', openFromHash);
</script>
</body>
</html>
